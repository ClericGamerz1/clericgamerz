<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Weather Forecast</h1>
            <p>Check the weather anywhere in the world</p>
        </header>


        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
            >

            <button onclick="searchWeather()">
                Search
            </button>
        </div>


        <!-- Loading -->
        <div id="loading">
            Loading weather...
        </div>


        <!-- Error -->
        <div id="error">
            City not found. Please try another city.
        </div>


        <!-- Current Weather -->
        <section class="current-weather">

            <div class="location">
                <h2 id="city">Kathmandu</h2>
                <p id="country">Nepal</p>
            </div>

            <div class="weather-main">

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

                <div>
                    <div class="temperature">
                        <span id="temperature">--</span>°C
                    </div>

                    <p id="condition">
                        Loading...
                    </p>
                </div>

            </div>


            <!-- Weather Details -->
            <div class="details">

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail-card">
                    <span>🌧️</span>
                    <p>Rain Chance</p>
                    <strong id="rain">--%</strong>
                </div>

            </div>

        </section>


        <!-- Forecast -->
        <section class="forecast">

            <h2>7-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
                <!-- Forecast cards will appear here -->
            </div>

        </section>

    </div>


    <footer>
        <p>Weather Forecast © 2026</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
